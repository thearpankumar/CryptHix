# Pull-request and master CI. Every job starts at once; `ci-ok` is the only required check.
# Each job runs one `cargo xtask ci <job>`, so `cargo xtask ci` locally checks the same things
# (see docs/CONTRIBUTING.md).
#
# Jobs about what a pull request changes (its commits, the links in the docs it touches, the
# fuzz smoke run and mutants of its lines) run on pull requests only: a push to master carries
# commits a pull request already checked. Master runs the build jobs, which also save the
# caches pull requests restore.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; master runs finish so their caches are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RUST_BACKTRACE: short

jobs:
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's changed files through the API
    outputs:
      side: ${{ steps.filter.outputs.side }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      mutants: ${{ steps.filter.outputs.mutants }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            side:
              - "tests/**"
              - "crates/foundation/types/**"
              - "xtask/**"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            fuzz:
              - "tests/fuzz/**"
              - "tests/Cargo.lock"
              - "crates/foundation/types/src/**"
              - "xtask/src/side.rs"
              - ".github/workflows/ci.yml"
            mutants:
              - "crates/**/*.rs"
            docs:
              - "**/*.md"
              - "lychee.toml"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
          tools: typos@1.51.1,zizmor@1.31.1
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo xtask ci lint

  pr:
    name: PR commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: cargo xtask ci pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask ci pr --base "$BASE"

  links:
    name: Links in changed docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o lychee.tar.gz \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 -C bin lychee-x86_64-unknown-linux-gnu/lychee
      # External links in the Markdown files this PR adds or changes; the weekly scheduled run
      # checks every file. File names go through xargs, never through a shell.
      - name: Check external links
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff -z --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.md' \
            | xargs -0 --no-run-if-empty "$RUNNER_TEMP/bin/lychee" --no-progress --

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: clippy
          workspaces: |
            . -> target
            tests -> target
      - run: cargo xtask ci clippy

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: cargo-nextest@0.9.148
      - run: cargo xtask ci test

  doc:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: doc
      - run: cargo xtask ci doc

  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: deny
          tools: cargo-deny@0.20.2,cargo-shear@1.14.0
      - run: cargo xtask ci deny

  side:
    name: tests/ workspace
    needs: changes
    # `changes` is skipped on push, so this job must not require it to succeed.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.side == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: side
          workspaces: |
            . -> target
            tests -> target
      - run: cargo xtask ci side

  fuzz-smoke:
    name: Fuzz smoke
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: fuzz
          workspaces: |
            . -> target
            tests -> target
          tools: cargo-fuzz@0.13.2
      - name: Install the pinned nightly
        run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - run: cargo xtask fuzz all --time 20
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore

  # Advisory: surviving mutants in the changed lines are reported, not blocking.
  mutants:
    name: Mutants (changed lines)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mutants == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: mutants
          tools: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - name: Mutate the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --in-place --no-shuffle --test-tool nextest
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - lint
      - pr
      - links
      - clippy
      - test
      - doc
      - deny
      - side
      - fuzz-smoke
      - mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: changes, pr, links, side, fuzz-smoke, mutants
          allowed-failures: mutants
