[package]
name = "crypthix-core"
description = "Write and read pipeline: chunk, compress, pad, encrypt, hash and sign."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crypthix-crypto.workspace = true
crypthix-types.workspace = true
zstd-safe = { version = "8.2.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
crypthix-crypto = { workspace = true, features = ["vectors"] }
fastcdc = "5.0.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bench]]
name = "chunking"
harness = false

[[bench]]
name = "inner"
harness = false
