# lychee settings for the weekly external link check (.github/workflows/scheduled.yml).
# Relative links and anchors are checked on every PR by `cargo xtask check-docs`.

# eprint.iacr.org answers 403 to lychee's default user agent and w3.org to a browser-like one;
# both accept a client that names itself.
user_agent = "crypthix-link-check/1 (+https://github.com/thearpankumar/CryptHix)"

# Addresses on the reader's own machine, such as the dev container's code-server.
exclude_loopback = true

# Sites that are briefly down (a 502 from tahoe-lafs.org, for example) get a second chance.
max_retries = 3
retry_wait_time = 5
timeout = 30
