[workspace]
resolver = "3"
members = ["crates/*/*", "apps/*", "xtask"]
# tests/ is its own workspace (fuzzing, vector generator): see tests/README.md.
exclude = ["tests"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/thearpankumar/CryptHix"
publish = false

[workspace.dependencies]
# Internal crates other crates depend on. Add an entry when a crate gains its first dependent:
# cargo warns about unused ones (see docs/backlog.md#architecture-rules for the layers).
crypthix-types = { path = "crates/foundation/types" }
crypthix-testkit = { path = "crates/foundation/testkit" }

# External crates.
cargo_metadata = "0.23"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# Denied, not forbidden: crypthix-crypto, crypthix-hardening and crypthix-fs
# may opt in with a module-level `#[allow(unsafe_code)]` and SAFETY comments.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Google Rust style guide alignment (docs/style-guide.md).
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
