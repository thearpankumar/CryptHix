[package]
name = "crypthix-vector-gen"
description = "Writes and checks the CryptHix format test vectors (format spec section 20)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false }
crypthix-crypto = { path = "../../../crates/foundation/crypto", features = ["test-rng"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
crypthix-types = { path = "../../../crates/foundation/types" }
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1.0.154"
