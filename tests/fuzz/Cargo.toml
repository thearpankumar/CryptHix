[package]
name = "crypthix-fuzz"
description = "cargo-fuzz binaries for the crypthix-types parsers; each calls crypthix-fuzz-harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
crypthix-fuzz-harness = { version = "0.0.0", path = "harness" }
libfuzzer-sys = "0.4.13"

[lints]
workspace = true

[[bin]]
name = "preamble"
path = "fuzz_targets/preamble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor_document"
path = "fuzz_targets/cbor_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor_differential"
path = "fuzz_targets/cbor_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor_structured"
path = "fuzz_targets/cbor_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_key"
path = "fuzz_targets/store_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "id_text"
path = "fuzz_targets/id_text.rs"
test = false
doc = false
bench = false
