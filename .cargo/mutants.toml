# cargo-mutants settings (https://mutants.rs/filter_mutants.html).
#
# Each exclusion is keyed on a function name, so it would also skip a matching mutant added to
# that function later. Each comment names every expression it is meant to cover; after changing
# one of these functions, compare `cargo mutants --workspace --all-features --list` with the
# same command plus `--no-config`: the difference must be exactly these 14 mutants.
exclude_re = [
    # `^` on flags with no bit in common is `|`, so these mutants cannot change behaviour. In
    # crypthix-crypto: the `|` of `ProtFlags::READ | ProtFlags::WRITE` in `map_secret`,
    # `anonymous` and `map_marker` (one each). In crypthix-core's `frame_check`: the four `|`
    # of `SINGLE_SEGMENT | UNUSED | RESERVED | CHECKSUM | DICT_ID`.
    'replace \| with \^ in (map_secret|anonymous|map_marker|frame_check)$',
    # `padme`: only the `<` of `len < 2`. padme(2) is 2 by the general formula too (e = 1,
    # s = 1, no low bits to clear).
    'replace < with <= in padme$',
    # crypthix-core's `Decompressor::stream`: only the `==` of `hint == 0` and of
    # `(input.pos(), output.pos()) == before`, the two `==` in it (not the `!=` of
    # `input.pos() != frame.len()`). frame_check and an output buffer of exactly the declared
    # content size let zstd finish the frame in its first call, so whether the loop breaks on
    # hint 0 or on no progress never shows; after the frame a further call reads nothing and
    # returns a non-zero hint. Both checks stay as defence in depth.
    'replace == with != in stream$',
    # `cut_with`: only `remaining > params.max` (to `>=`) and `remaining < center` (to `==` or
    # `<=`), the one `>` and the one `<` in it (not the `<=` of `remaining <= params.min`).
    # Capping a remainder of exactly the maximum at the maximum changes nothing, and neither
    # does lowering the centre to a remainder shorter than the average or equal to it: a split
    # past the end of the pairs falls back to taking them all as strict pairs, as a split at
    # the end does.
    'replace > with >= in cut_with$',
    'replace < with (==|<=) in cut_with$',
    # `StreamChunker::refill`: only the `||` of `self.start > self.end || self.end >
    # window.len()`, the one `||` in it. `start <= end <= window.len()` always holds, so the
    # defensive check that fails instead of panicking never fires, whichever operator joins
    # its halves.
    'replace \|\| with && in StreamChunker<.*>::refill$',
]
