# cargo-nextest settings. CI selects the `ci` profile with NEXTEST_PROFILE=ci.

[profile.ci]
# Report every failing test, not just the first.
fail-fast = false
# No retries: a flaky test is a bug to fix, not to hide.
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }
